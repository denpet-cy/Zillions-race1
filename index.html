<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$ZILLIONS Race Picker - Live Community Draw & Giveaway</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            300: '#FDE047',
                            400: '#FACC15',
                            500: '#EAB308',
                            600: '#CA8A04',
                            700: '#A16207',
                        },
                        darkbg: '#090a0f',
                        cardbg: '#11131e',
                        panelbg: '#171928'
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #07080c;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .gold-glow {
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.35);
        }
        
        .gold-glow-lg {
            box-shadow: 0 0 50px rgba(234, 179, 8, 0.55);
        }

        .text-gold-gradient {
            background: linear-gradient(135deg, #FFF599 0%, #FACC15 50%, #CA8A04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-gold {
            background: linear-gradient(135deg, #FACC15 0%, #EAB308 50%, #CA8A04 100%);
            color: #000;
            font-weight: 800;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #FFE066 0%, #FACC15 50%, #EAB308 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(234, 179, 8, 0.45);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #25283b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #eab308;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .pulse-glow-anim {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-darkbg text-gray-100 antialiased selection:bg-gold-50
